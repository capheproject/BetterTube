name: Release

# Publishes a GitHub release, either when a version tag is pushed (e.g. v0.1.0-preview) or when
# run manually with a version (Actions > Release > Run workflow), in which case the tag is
# created on the selected commit. Release notes come from .github/release-notes/<version>.md.
# Versions with a "-" (like -preview) are marked as pre-releases.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0-preview"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Run tests
        run: ./gradlew testDebugUnitTest

      # The private release key lives in the repository's Actions secrets
      # (BETTERTUBE_KEYSTORE_BASE64, BETTERTUBE_KEYSTORE_PASSWORD, BETTERTUBE_KEY_ALIAS,
      # BETTERTUBE_KEY_PASSWORD). Without them, a debug build is published as before.
      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BETTERTUBE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "BETTERTUBE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNED_RELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          BETTERTUBE_RELEASE: ${{ env.VERSION }}
          BETTERTUBE_KEYSTORE_PASSWORD: ${{ secrets.BETTERTUBE_KEYSTORE_PASSWORD }}
          BETTERTUBE_KEY_ALIAS: ${{ secrets.BETTERTUBE_KEY_ALIAS }}
          BETTERTUBE_KEY_PASSWORD: ${{ secrets.BETTERTUBE_KEY_PASSWORD }}
        run: |
          if [ "$SIGNED_RELEASE" = "true" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Name the APK
        run: |
          if [ "$SIGNED_RELEASE" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "BetterTube-${VERSION}.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "BetterTube-${VERSION}.apk"
          fi
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ env.VERSION }}
          commit: ${{ github.sha }}
          name: BetterTube ${{ env.VERSION }}
          bodyFile: .github/release-notes/${{ env.VERSION }}.md
          artifacts: BetterTube-${{ env.VERSION }}.apk
          prerelease: ${{ contains(env.VERSION, '-') }}
          allowUpdates: true
