# Deletes a release and its tag. Run manually: Actions > Delete release > Run workflow.
name: Delete release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to delete (e.g. v0.1.2-preview)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release delete "$VERSION" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
